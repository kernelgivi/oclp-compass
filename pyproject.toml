[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oclp-compass"
version = "0.2.0"
description = "An evidence-aware, local-first macOS upgrade advisor for Intel Macs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ali Chawki"}]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: MacOS", "Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
oclp-compass = "compass.cli:main"

[tool.setuptools.package-data]
compass = ["data/*.json", "web/*"]

[tool.setuptools.packages.find]
include = ["compass*"]
